name: tana

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tana}
      POSTGRES_DB: ${POSTGRES_DB:-tana}
    volumes:
      - tana-db:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tana} -d ${POSTGRES_DB:-tana}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/carlos-dubon/tana:${TANA_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tana}:${POSTGRES_PASSWORD:-tana}@db:5432/${POSTGRES_DB:-tana}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your .env file}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  tana-db:
